[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-workshop"
version = "0.1.0"
description = "Multi-terminal AI Agent Workshop — Hermes, Claude Code, and Codex in one web UI"
requires-python = ">=3.10"
dependencies = ["websockets"]

[project.scripts]
ai-workshop = "server:main"
